# Avvio locale completo: docker compose up --build  →  http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lca
      POSTGRES_PASSWORD: lca
      POSTGRES_DB: lca
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgresql://lca:lca@db:5432/lca
      APP_URL: http://localhost:3000
      APP_SECRET: ${APP_SECRET:-sviluppo-locale-cambia-questo-segreto-0123456789}
volumes:
  pgdata:
